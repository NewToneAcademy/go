<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#6f8fc4">
<title>New Tone Academy</title>
<link rel="preload" as="image" href="bg.jpg">
<style>
  :root {
    --sky: #6f8fc4;
    --text: #ffffff;
    --muted: rgba(255, 255, 255, .82);
    --glass: rgba(255, 255, 255, .16);
    --glass-border: rgba(255, 255, 255, .32);
    --accent: #fe2c55;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100%;
    color: var(--text);
    font: 18px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: var(--sky) url("bg.jpg") center bottom / cover no-repeat;
  }
  /* Лёгкое затемнение неба сверху, чтобы белый текст читался */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(20, 35, 70, .45) 0%, rgba(20, 35, 70, .12) 45%, rgba(0, 0, 0, 0) 60%);
  }

  .loading {
    position: relative;
    display: flex; align-items: flex-start; justify-content: center;
    padding-top: 22vh; min-height: 100%;
    color: var(--muted); letter-spacing: .3px;
  }
  .wrap {
    position: relative;
    display: none;
    max-width: 440px; margin: 0 auto;
    padding: 70px 20px 32px;
  }
  body.show .wrap { display: block; }
  body.show .loading { display: none; }

  /* Стрелка на «⋯» в правом верхнем углу встроенного браузера TikTok */
  .pointer {
    display: none;
    position: fixed; top: 4px; right: 12px; z-index: 2;
    pointer-events: none;
  }
  body.show .pointer { display: block; }
  .pointer .arrow {
    font-size: 64px; line-height: 1;
    color: #fff;
    text-shadow: 0 2px 12px rgba(0, 0, 0, .35);
    animation: bounce 1.1s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(6px, -10px); }
  }

  .brand {
    font-size: 13px; font-weight: 600;
    letter-spacing: 2.4px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 14px;
  }
  h1 {
    font-size: 30px; line-height: 1.15; font-weight: 700;
    margin: 0 0 12px;
    text-shadow: 0 2px 16px rgba(0, 0, 0, .18);
  }
  p { margin: 0; color: var(--muted); }

  .steps {
    margin-top: 20px;
    padding: 16px 18px 2px;
    border-radius: 22px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 10px 30px rgba(15, 30, 60, .18);
  }
  .step { display: flex; gap: 14px; margin-bottom: 14px; align-items: center; font-size: 18px; }
  .num {
    flex: none; width: 32px; height: 32px; border-radius: 50%;
    background: #fff; color: #36507f; font-weight: 700;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .dots {
    display: inline-block; padding: 0 10px; border-radius: 8px;
    background: rgba(255, 255, 255, .25); font-weight: 700; letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="loading">Открываем…</div>

  <div class="pointer"><div class="arrow">↗</div></div>

  <main class="wrap">
    <div class="brand">New Tone Academy</div>
    <h1>Вы почти на месте</h1>
    <p>TikTok не пускает в Telegram из своего браузера. Один короткий шаг:</p>

    <div class="steps">
      <div class="step">
        <div class="num">1</div>
        <div>Нажмите <span class="dots">⋯</span> вверху справа</div>
      </div>
      <div class="step">
        <div class="num">2</div>
        <div>Выберите <b>«Открыть в браузере»</b></div>
      </div>
    </div>
  </main>

<script>
  // ===== НАСТРОЙКИ =====
  // Куда ведём человека, когда он уже во внешнем браузере (лендинг Leeloo)
  var TARGET = 'https://wep.wf/aagal8';
  // =====================

  var params = new URLSearchParams(location.search);
  var debug = params.get('debug'); // ?debug=ios или ?debug=android — посмотреть экран без TikTok
  params.delete('debug');

  // Пробрасываем UTM и прочие параметры на лендинг
  var target = new URL(TARGET);
  params.forEach(function (v, k) { target.searchParams.set(k, v); });
  var targetUrl = target.toString();

  var ua = navigator.userAgent || '';
  // Встроенный браузер TikTok (в разных версиях по-разному подписан)
  var isTikTok = /musical_ly|Bytedance|ByteLocale|TikTok|trill_/i.test(ua);
  var isAndroid = /Android/i.test(ua);

  if (debug) {
    isTikTok = true;
    isAndroid = debug === 'android';
  }

  function showHelp() {
    document.body.classList.add('show');
  }

  function chromeIntent(url) {
    var u = new URL(url);
    return 'intent://' + u.host + u.pathname + u.search + u.hash +
      '#Intent;scheme=' + u.protocol.replace(':', '') +
      ';package=com.android.chrome' +
      ';S.browser_fallback_url=' + encodeURIComponent(url) + ';end';
  }

  if (!isTikTok) {
    // Обычный браузер, Instagram и т.д. — сразу на лендинг
    location.replace(targetUrl);
  } else if (isAndroid) {
    // Android: открываем лендинг в Chrome, если не вышло — инструкция
    if (!debug) location.href = chromeIntent(targetUrl);
    setTimeout(showHelp, debug ? 0 : 1200);
  } else {
    // iOS: TikTok блокирует любой переход в Safari, остаётся только инструкция
    showHelp();
  }
</script>
</body>
</html>
