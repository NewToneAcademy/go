<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>New Tone Academy</title>
<style>
  :root {
    --bg: #0f0f12;
    --card: #1b1b21;
    --text: #f4f4f6;
    --muted: #a3a3ad;
    --accent: #fe2c55;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 18px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .loading {
    display: flex; align-items: center; justify-content: center;
    min-height: 100%; color: var(--muted);
  }
  .wrap {
    display: none;
    max-width: 420px; margin: 0 auto;
    padding: 110px 20px 32px;
  }
  body.show .wrap { display: block; }
  body.show .loading { display: none; }

  /* Стрелка на «⋯» в правом верхнем углу встроенного браузера TikTok */
  .pointer {
    display: none;
    position: fixed; top: 4px; right: 12px;
    pointer-events: none;
  }
  body.show .pointer { display: block; }
  .pointer .arrow {
    font-size: 64px; line-height: 1;
    color: var(--accent);
    animation: bounce 1.1s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(6px, -10px); }
  }

  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 12px; }
  p { margin: 0; color: var(--muted); }
  .steps {
    background: var(--card); border-radius: 18px;
    padding: 22px 20px 8px; margin-top: 24px;
  }
  .step { display: flex; gap: 14px; margin-bottom: 18px; align-items: flex-start; font-size: 20px; }
  .num {
    flex: none; width: 32px; height: 32px; border-radius: 50%;
    background: var(--accent); color: #fff; font-weight: 700;
    display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  .step b { color: var(--text); }
  .dots {
    display: inline-block; padding: 0 10px; border-radius: 8px;
    background: #2c2c34; color: var(--text); font-weight: 700; letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="loading">Открываем…</div>

  <div class="pointer"><div class="arrow">↗</div></div>

  <main class="wrap">
    <h1>Откройте страницу в браузере</h1>
    <p>TikTok не пускает в Telegram из своего браузера. Это займёт 2 секунды:</p>

    <div class="steps">
      <div class="step">
        <div class="num">1</div>
        <div>Нажмите <span class="dots">⋯</span> в <b>правом верхнем углу</b></div>
      </div>
      <div class="step">
        <div class="num">2</div>
        <div>Выберите <b>«Открыть в браузере»</b></div>
      </div>
    </div>
  </main>

<script>
  // ===== НАСТРОЙКИ =====
  // Куда ведём человека, когда он уже во внешнем браузере (лендинг Leeloo)
  var TARGET = 'https://wep.wf/aagal8';
  // =====================

  var params = new URLSearchParams(location.search);
  var debug = params.get('debug'); // ?debug=ios или ?debug=android — посмотреть экран без TikTok
  params.delete('debug');

  // Пробрасываем UTM и прочие параметры на лендинг
  var target = new URL(TARGET);
  params.forEach(function (v, k) { target.searchParams.set(k, v); });
  var targetUrl = target.toString();

  var ua = navigator.userAgent || '';
  // Встроенный браузер TikTok (в разных версиях по-разному подписан)
  var isTikTok = /musical_ly|Bytedance|ByteLocale|TikTok|trill_/i.test(ua);
  var isAndroid = /Android/i.test(ua);

  if (debug) {
    isTikTok = true;
    isAndroid = debug === 'android';
  }

  function showHelp() {
    document.body.classList.add('show');
  }

  function chromeIntent(url) {
    var u = new URL(url);
    return 'intent://' + u.host + u.pathname + u.search + u.hash +
      '#Intent;scheme=' + u.protocol.replace(':', '') +
      ';package=com.android.chrome' +
      ';S.browser_fallback_url=' + encodeURIComponent(url) + ';end';
  }

  if (!isTikTok) {
    // Обычный браузер, Instagram и т.д. — сразу на лендинг
    location.replace(targetUrl);
  } else if (isAndroid) {
    // Android: открываем лендинг в Chrome, если не вышло — инструкция
    if (!debug) location.href = chromeIntent(targetUrl);
    setTimeout(showHelp, debug ? 0 : 1200);
  } else {
    // iOS: TikTok блокирует любой переход в Safari, остаётся только инструкция
    showHelp();
  }
</script>
</body>
</html>
