<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>New Tone Academy</title>
<style>
  :root {
    --bg: #0f0f12;
    --card: #1b1b21;
    --text: #f4f4f6;
    --muted: #a3a3ad;
    --accent: #2aabee;
    --accent-2: #fe2c55;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .loading {
    display: flex; align-items: center; justify-content: center;
    min-height: 100%; color: var(--muted);
  }
  .wrap {
    display: none;
    max-width: 420px; margin: 0 auto;
    padding: 96px 20px 32px;
  }
  body.show .wrap { display: block; }
  body.show .loading { display: none; }

  /* Стрелка на «⋯» в правом верхнем углу встроенного браузера TikTok */
  .pointer {
    display: none;
    position: fixed; top: 6px; right: 14px;
    text-align: right; pointer-events: none;
  }
  body.ios .pointer, body.android .pointer { display: block; }
  .pointer .arrow {
    font-size: 54px; line-height: 1;
    color: var(--accent-2);
    animation: bounce 1.1s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(6px, -10px); }
  }

  h1 { font-size: 26px; line-height: 1.2; margin: 0 0 12px; }
  p { margin: 0 0 16px; color: var(--muted); }
  .steps {
    background: var(--card); border-radius: 16px;
    padding: 18px 18px 6px; margin: 20px 0;
  }
  .step { display: flex; gap: 12px; margin-bottom: 14px; align-items: flex-start; }
  .num {
    flex: none; width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent-2); color: #fff; font-weight: 700;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
  }
  .step b { color: var(--text); }
  .dots {
    display: inline-block; padding: 0 8px; border-radius: 8px;
    background: #2c2c34; color: var(--text); font-weight: 700; letter-spacing: 1px;
  }
  .btn {
    display: block; width: 100%;
    border: 0; border-radius: 14px; padding: 16px;
    font: inherit; font-weight: 600; text-align: center; text-decoration: none;
    cursor: pointer; margin-bottom: 12px;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: var(--card); color: var(--text); }
  .or { text-align: center; color: var(--muted); font-size: 14px; margin: 22px 0 12px; }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: #fff; color: #000; padding: 10px 18px; border-radius: 999px;
    font-size: 15px; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
  <div class="loading">Открываем…</div>

  <div class="pointer"><div class="arrow">↗</div></div>

  <main class="wrap">
    <h1>Откройте страницу в браузере</h1>
    <p>TikTok не даёт перейти в Telegram из своего браузера. Это займёт 2 секунды:</p>

    <div class="steps">
      <div class="step">
        <div class="num">1</div>
        <div>Нажмите <span class="dots">⋯</span> в <b>правом верхнем углу</b></div>
      </div>
      <div class="step">
        <div class="num">2</div>
        <div>Выберите <b id="open-label">«Открыть в браузере»</b></div>
      </div>
    </div>

    <button class="btn btn-primary" id="btn-browser" type="button">Открыть в браузере</button>
    <button class="btn btn-secondary" id="btn-copy-link" type="button">Скопировать ссылку</button>

    <div class="or">или напишите боту напрямую</div>
    <button class="btn btn-secondary" id="btn-copy-bot" type="button">Скопировать @<span class="bot-name"></span></button>
    <p style="font-size:14px;text-align:center">Откройте Telegram, вставьте в поиск и нажмите «Старт»</p>
  </main>

  <div class="toast" id="toast">Скопировано</div>

<script>
  // ===== НАСТРОЙКИ =====
  // Куда ведём человека, когда он уже во внешнем браузере (лендинг Leeloo)
  var TARGET = 'https://wep.wf/aagal8';
  // Бот для запасного варианта «скопировать ник»
  var BOT = 'NewToneAcademy_Bot';
  // =====================

  var params = new URLSearchParams(location.search);
  var debug = params.get('debug'); // ?debug=ios или ?debug=android — посмотреть экран без TikTok
  params.delete('debug');

  // Пробрасываем UTM и прочие параметры на лендинг
  var target = new URL(TARGET);
  params.forEach(function (v, k) { target.searchParams.set(k, v); });
  var targetUrl = target.toString();

  var ua = navigator.userAgent || '';
  // Встроенный браузер TikTok (в разных версиях по-разному подписан)
  var isTikTok = /musical_ly|Bytedance|ByteLocale|TikTok|trill_/i.test(ua);
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);

  if (debug) {
    isTikTok = true;
    isAndroid = debug === 'android';
    isIOS = debug === 'ios';
  }

  document.querySelectorAll('.bot-name').forEach(function (el) { el.textContent = BOT; });

  function showHelp() {
    document.body.classList.add('show');
    if (isIOS) document.body.classList.add('ios');
    if (isAndroid) document.body.classList.add('android');
    if (isIOS) document.getElementById('open-label').textContent = '«Открыть в браузере» / «Открыть в Safari»';
  }

  function chromeIntent(url) {
    var u = new URL(url);
    return 'intent://' + u.host + u.pathname + u.search + u.hash +
      '#Intent;scheme=' + u.protocol.replace(':', '') +
      ';package=com.android.chrome' +
      ';S.browser_fallback_url=' + encodeURIComponent(url) + ';end';
  }

  function openExternal() {
    if (debug) return;
    if (isAndroid) {
      location.href = chromeIntent(targetUrl);
    } else if (isIOS) {
      // iOS 17+: схема x-safari-https:// открывает ссылку в Safari
      location.href = 'x-safari-' + targetUrl;
    }
  }

  function copy(text) {
    var done = function () {
      var t = document.getElementById('toast');
      t.classList.add('on');
      setTimeout(function () { t.classList.remove('on'); }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
    } else {
      fallbackCopy(text); done();
    }
  }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  document.getElementById('btn-browser').addEventListener('click', openExternal);
  document.getElementById('btn-copy-link').addEventListener('click', function () { copy(targetUrl); });
  document.getElementById('btn-copy-bot').addEventListener('click', function () { copy('@' + BOT); });

  if (!isTikTok) {
    // Обычный браузер, Instagram и т.д. — сразу на лендинг
    location.replace(targetUrl);
  } else {
    openExternal();
    // Если автопереход не сработал (или TikTok его заблокировал) — показываем инструкцию
    setTimeout(showHelp, debug ? 0 : 1200);
  }
</script>
</body>
</html>
